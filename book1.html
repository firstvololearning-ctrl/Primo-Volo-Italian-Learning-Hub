<body>

  <header class="book-header">

    <a
      href="index.html"
      class="book-back-link activity-center-home-link"
    >
      ✈️ Primo Volo · Home
    </a>

    <div>
      <h1>
        📘 Ciao, sono Volo!
      </h1>

<p>
  Mini-libro interattivo
</p>

<a
  href="https://firstvololearning.com"
  class="book-brand-link"
  target="_blank"
  rel="noopener noreferrer"
>
  <img
    src="images/logo/logo.png"
    alt=""
    class="book-brand-logo"
  >

  <span>
    Primo Volo d'Italiano · First Volo Learning
  </span>
</a>
    </div>

    <button
  id="printBookButton"
  class="book-header-button"
  type="button"
>
  🖨️ Stampa · Print
</button>

  </header>

  <main class="book-page">

    <section
      class="book-reader"
      aria-label="Interactive mini-book"
    >

      <div class="book-image-frame">

        <img
          id="bookImage"
          src="images/book1/book1-01.png"
          alt=""
          class="book-image"
        >

      </div>

      <div
        id="bookText"
        class="book-text"
        aria-live="polite"
      ></div>

      <div class="book-audio-row">

        <button
          id="bookAudioButton"
          class="book-audio-button"
          type="button"
        >
          🔊 Ascolta
        </button>

      </div>

      <div class="book-navigation">

        <button
          id="previousBookPage"
          class="book-nav-button"
          type="button"
        >
          ← Indietro
        </button>

        <span
          id="bookPageCounter"
          class="book-page-counter"
        >
          Pagina 1 di 13
        </span>

        <button
          id="nextBookPage"
          class="book-nav-button"
          type="button"
        >
          Avanti →
        </button>

      </div>

    </section>

    <section
      id="printableBook"
      class="printable-book"
      aria-hidden="true"
    ></section>

  </main>
<footer class="book-brand-footer">
